# Staging Blueprint: connect to branch `staging` (or your chosen pre-prod branch).
# Use a separate Anthropic key and other secrets from production.
services:
  - type: web
    name: signalkit-web-staging
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start:web
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signalkit-db-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: signalkit-redis-staging
          type: keyvalue
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514

  - type: worker
    name: signalkit-worker-staging
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start:worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signalkit-db-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: signalkit-redis-staging
          type: keyvalue
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514

  - type: cron
    name: signalkit-cron-staging
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start:cron
    schedule: "0 6 * * 1"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signalkit-db-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: signalkit-redis-staging
          type: keyvalue
          property: connectionString

databases:
  - name: signalkit-db-staging
    plan: starter

keyValueStores:
  - name: signalkit-redis-staging
    plan: starter
